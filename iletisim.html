<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Yusuf Batuhan Kıraç</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #fdfdfd; color: #222; line-height: 1.6; overflow-x: hidden; }
        
        header { padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaeaea; background-color: #fff; position: relative; z-index: 10; }
        .logo { font-size: 15px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        nav a { text-decoration: none; color: #333; margin-left: 25px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        nav a:hover { color: #888; }
        
        @keyframes smoothFadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .container { max-width: 600px; margin: 80px auto; padding: 0 20px; opacity: 0; animation: smoothFadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        h1 { font-size: 32px; font-weight: normal; letter-spacing: 4px; margin-bottom: 20px; text-transform: uppercase; text-align: center; }
        p.desc { text-align: center; color: #666; margin-bottom: 40px; font-size: 15px; }

        form { display: flex; flex-direction: column; gap: 20px; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
        input, textarea { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; font-family: inherit; transition: border-color 0.3s, box-shadow 0.3s; background-color: #fafafa; }
        input:focus, textarea:focus { outline: none; border-color: #222; background-color: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        textarea { resize: vertical; min-height: 150px; }
        button { padding: 18px; background-color: #222; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; transition: background 0.3s, transform 0.2s; }
        button:hover { background-color: #444; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        button:active { transform: translateY(0); }

        footer { margin-top: 80px; padding: 40px 50px; text-align: center; border-top: 1px solid #eaeaea; font-size: 12px; color: #999; letter-spacing: 1px; display: flex; flex-direction: column; gap: 15px; opacity: 0; animation: smoothFadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards; }
        .social-links { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        footer a { color: #555; text-decoration: none; font-weight: bold; transition: color 0.3s; text-transform: uppercase; }
        footer a:hover { color: #000; }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 20px; padding: 20px; text-align: center; }
            nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
            nav a { margin: 0; font-size: 11px; }
            .container { margin: 40px auto; }
            form { padding: 25px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Yusuf Batuhan Kıraç</div>
        <nav>
            <a href="index.html">Anasayfa</a>
            <a href="hakkinda.html">Hakkında</a>
            <a href="iletisim.html">İletişim</a>
        </nav>
    </header>

    <div class="container">
        <h1>İletişim</h1>
        <p class="desc">Projeler ve iş birlikleri için aşağıdaki formu doldurarak bana doğrudan e-posta gönderebilirsiniz.</p>

        <form action="mailto:ybatuhankirac@gmail.com" method="post" enctype="text/plain">
            <input type="text" name="İsim" placeholder="Adınız Soyadınız" required>
            <input type="email" name="Mail" placeholder="E-posta Adresiniz" required>
            <textarea name="Mesaj" placeholder="Mesajınız..." required></textarea>
            <button type="submit">Gönder</button>
        </form>
    </div>

    <footer>
        <div class="social-links">
            <a href="https://instagram.com/batuhan.kirac_" target="_blank">Instagram: @batuhan.kirac_</a>
            <a href="https://www.imdb.com/name/nm9898006/?ref_=ext_shr_lnk" target="_blank">IMDb Profili</a>
            <a href="https://youtube.com/@yusufbatuhankrac8047?si=PFyNIbL9SMADGZNs" target="_blank">YouTube</a>
        </div>
        <span>© 2026 Yusuf Batuhan Kıraç. Tüm Hakları Saklıdır.</span>
    </footer>

</body>
</html>
